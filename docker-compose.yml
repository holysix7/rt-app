# PostgreSQL lokal untuk development.
#   docker compose up -d
# Lalu di .env.local:
#   DATABASE_URL=postgres://rt:rt@localhost:5432/rt_app
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rt
      POSTGRES_PASSWORD: rt
      POSTGRES_DB: rt_app
      TZ: Asia/Jakarta
    ports:
      - "5432:5432"
    volumes:
      - rt-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rt -d rt_app"]
      interval: 5s
      retries: 10

volumes:
  rt-pgdata:
